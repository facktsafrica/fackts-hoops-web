<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — FACKTS Hoops</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #020617;
        color: #ffffff;
        text-align: center;
      }
      .wrapper {
        max-width: 520px;
        padding: 2rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1rem;
        border-radius: 999px;
        background: rgba(249, 115, 22, 0.18);
        color: #f97316;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.8rem;
      }
      a {
        color: #f97316;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="badge">FACKTS Hoops</div>
      <h1>Offline mode active</h1>
      <p>
        You’re offline, but the FACKTS Hoops app remains available.
        Please check your connection or tap a supported page to continue.
      </p>
      <p>
        <a href="/">Return home</a>
      </p>
    </div>
  </body>
</html>
